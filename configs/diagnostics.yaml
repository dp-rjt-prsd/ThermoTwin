# Illustrative ThermoTwin fault scenario and detector settings; not manufacturer data.
fault_detection:
  # Synthetic schedule applied only inside BatteryEnvironment.
  fault_cell_index: 5
  fault_start_time_s: 60.0
  resistance_multiplier: 3.0
  duration_s: 180.0
  current_a: 160.0
  smoke_test:
    fault_cell_index: 5
    fault_start_time_s: 12.0
    resistance_multiplier: 3.0
    duration_s: 30.0
    current_a: 120.0
  detector:
    rolling_window_steps: 10
    score_threshold: 3.0
    persistence_steps: 3
    # Noise floor for the rolling residual spread (about one sensor resolution).
    # Prevents tiny, harmless residual shifts (e.g. a coolant-flow step) from
    # producing huge scores when the simulated residual is otherwise noise-free.
    epsilon_k: 0.05
