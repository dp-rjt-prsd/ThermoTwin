# Illustrative prototype assumptions, not manufacturer data.

threshold_controller:
  # Strictly ascending boundaries define these exact temperature bands:
  # Tmax < 303.15 K; 303.15 <= Tmax < 308.15 K;
  # 308.15 <= Tmax < 313.15 K; Tmax >= 313.15 K.
  temperature_boundaries_k: [303.15, 308.15, 313.15]
  # Flows map in order to minimum, low, medium, and maximum bands.
  stages:
    - name: minimum
      coolant_mass_flow_kg_s: 0.0
    - name: low
      coolant_mass_flow_kg_s: 0.025
    - name: medium
      coolant_mass_flow_kg_s: 0.06
    - name: maximum
      coolant_mass_flow_kg_s: 0.1

pid_controller:
  target_temperature_k: 308.15
  kp_kg_s_k: 0.005
  ki_kg_s_k_s: 0.0001
  kd_kg_s_k_per_s: 0.0
  minimum_coolant_mass_flow_kg_s: 0.0
  maximum_coolant_mass_flow_kg_s: 0.1

predictive_controller:
  # Illustrative horizon length; elapsed seconds follow the control interval.
  horizon_steps: 12
  candidate_count: 5
  # Keep candidate flows within the illustrative cooling configuration.
  minimum_coolant_mass_flow_kg_s: 0.0
  maximum_coolant_mass_flow_kg_s: 0.1
  thermal_safety_limit_k: 313.15
  # Cubic pump-power approximation; this is not a manufacturer pump curve.
  pump_power_coefficient_w_s3_kg3: 100000.0
  objective_weights:
    # Illustrative scalarization values; tune against measured experiments.
    peak_temperature_weight: 1.0
    temperature_spread_weight: 1.0
    pump_energy_weight: 0.0001
    safety_penalty_weight: 100.0
    # Comfort band: forecast peaks below 33 C (306.15 K) cost nothing, so the
    # controller only spends pump energy when the twin predicts the pack heading
    # above it. The safety penalty still applies above the 40 C limit.
    peak_temperature_reference_k: 306.15

thermal_safety_limit_k: 313.15

# Cubic approximation: pump_power_w = coefficient * flow_kg_s ** 3.
pump_power_coefficient_w_s3_kg3: 100000.0
