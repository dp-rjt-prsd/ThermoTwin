# Small data-driven baseline: 17 current/state features to 12 cell temperature deltas.
model:
  input_dim: 17
  output_dim: 12
  hidden_widths: [64, 32]
  activation: gelu

training:
  seed: 1729
  batch_size: 64
  learning_rate: 0.001
  max_epochs: 200
  patience: 20
  min_improvement: 0.00001
  weight_decay: 0.0001
  device_policy: auto

smoke_test:
  seed: 1729
  batch_size: 16
  learning_rate: 0.001
  max_epochs: 3
  patience: 2
  min_improvement: 0.0
  weight_decay: 0.0
  device_policy: cpu

# The physics-loss multiplier is dimensionless. Residuals are normalized by each
# characteristic power scale, in watts, before the squared physics loss is formed.
physics_loss:
  standard:
    lambda_physics: 0.1
    residual_scale_w: 10.0
    # Optional collocation: unlabeled rows per training row where only the energy
    # balance is enforced, at random current (0 to max) and random coolant flow.
    # Off by default: in a sweep it did not improve out-of-distribution forecasts.
    collocation_samples_per_row: 0
    collocation_max_current_a: 320.0
  smoke_test:
    lambda_physics: 0.1
    residual_scale_w: 10.0
